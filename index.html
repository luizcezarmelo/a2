<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#354a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gastos no Cartão</title>
<style>
:root{
  --shell:#354a5f;
  --shell-2:#2b3d4f;
  --bg:#f7f7f7;
  --card:#ffffff;
  --line:#d9d9d9;
  --field:#89919a;
  --text:#32363a;
  --label:#6a6d70;
  --primary:#0a6ed1;
  --primary-dark:#085caf;
  --neg:#bb0000;
  --pos:#107e3e;
  --cre-bg:#e5f0fa;
  --cre-tx:#0854a0;
  --deb-bg:#e8f5e9;
  --deb-tx:#107e3e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:"72","72full",Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.4;
  min-height:100vh;
}
button,input,select{font-family:inherit}

/* ---------- Tela de PIN ---------- */
#lock{
  position:fixed;inset:0;z-index:50;
  background:var(--shell);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.lock-box{
  background:var(--card);
  width:100%;max-width:340px;
  border-radius:8px;
  padding:24px 20px 20px;
  text-align:center;
}
.lock-box h1{font-size:20px;margin:0 0 4px;font-weight:600}
.lock-box p{margin:0 0 16px;color:var(--label);font-size:14px}
#dots{display:flex;gap:14px;justify-content:center;margin:6px 0 8px}
#dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--field);display:block}
#dots i.on{background:var(--primary);border-color:var(--primary)}
#lockMsg{min-height:20px;color:var(--neg);font-size:13px;margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{
  height:56px;font-size:22px;background:#fff;color:var(--text);
  border:1px solid var(--field);border-radius:6px;cursor:pointer;
}
.pad button:active{background:#eaf1f9}
.pad .alt{font-size:14px;color:var(--primary);border-color:var(--line)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Shell ---------- */
.shell{
  background:var(--shell);color:#fff;
  position:sticky;top:0;z-index:10;
  padding-top:env(safe-area-inset-top,0px);
}
.shell-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.shell .title{font-size:17px;font-weight:600;flex:1}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#dfe6ed}
.status .dot{width:9px;height:9px;border-radius:50%;background:#e9730c;display:inline-block}
.status.ok .dot{background:#2ecc71}
.ghost{
  background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);
  border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;
}
.tabs{display:flex;background:var(--shell-2)}
.tab{
  flex:1;padding:12px 8px;font-size:15px;color:#cfd8e1;background:transparent;
  border:0;border-bottom:3px solid transparent;cursor:pointer;
}
.tab.active{color:#fff;border-bottom-color:#fff;font-weight:600}

main{max-width:680px;margin:0 auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom,0px))}

/* ---------- Cards e formulário ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:14px;margin-bottom:14px;
}
.card h2{font-size:16px;margin:0 0 12px;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--label);margin-bottom:4px}
.field input,.field select{
  width:100%;height:46px;padding:0 12px;font-size:16px;color:var(--text);
  background:#fff;border:1px solid var(--field);border-radius:6px;
}
.field input:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.row2{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:600px){.row2{grid-template-columns:1fr 1fr}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:46px;padding:0 18px;font-size:16px;font-weight:600;
  border-radius:6px;border:1px solid var(--primary);cursor:pointer;
  background:var(--primary);color:#fff;
}
.btn:active{background:var(--primary-dark)}
.btn.block{width:100%}
.btn.sec{background:#fff;color:var(--primary)}
.btn.danger{background:#fff;color:var(--neg);border-color:var(--neg)}
.link{background:none;border:0;color:var(--primary);font-size:14px;cursor:pointer;padding:6px 0}

/* ---------- Linhas de lançamentos ---------- */
.row{
  display:flex;gap:10px;justify-content:space-between;align-items:flex-start;
  padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;
}
.row:last-child{border-bottom:0}
.row:active,.row:focus{background:#eaf1f9;outline:0}
.r-main{min-width:0;flex:1}
.r-desc{font-weight:600;word-break:break-word}
.r-meta{font-size:13px;color:var(--label);margin-top:2px}
.r-obs{font-size:13px;color:var(--label);margin-top:2px;font-style:italic;word-break:break-word}
.r-val{font-weight:600;white-space:nowrap}
.badge{
  display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin-left:4px;
}
.badge.cre{background:var(--cre-bg);color:var(--cre-tx)}
.badge.deb{background:var(--deb-bg);color:var(--deb-tx)}
.empty{color:var(--label);padding:8px 4px;font-size:14px}

/* ---------- Relatório ---------- */
.monthnav{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;
}
.monthnav .m-label{font-size:17px;font-weight:600;text-align:center;flex:1}
.monthnav button{
  width:46px;height:46px;font-size:22px;background:#fff;color:var(--primary);
  border:1px solid var(--field);border-radius:6px;cursor:pointer;
}
.card-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;padding:10px 4px 0;border-top:2px solid var(--text);font-weight:700;
}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.card-head h2{margin:0}
.card-head span{font-size:13px;color:var(--label)}
.grand{
  background:var(--shell);color:#fff;border-radius:8px;padding:14px;
  display:flex;justify-content:space-between;font-weight:700;font-size:17px;
}

/* ---------- Modal de edição ---------- */
#modal{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;
  border-radius:12px 12px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));
}
@media(min-width:600px){
  #modal{align-items:center}
  .sheet{border-radius:10px}
}
.sheet h2{font-size:17px;margin:0 0 12px}
.sheet .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sheet .actions .full{grid-column:1 / -1}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);background:#32363a;color:#fff;
  padding:11px 16px;border-radius:6px;font-size:14px;z-index:60;
  max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.show{opacity:1}
.foot{text-align:center;margin-top:4px}
</style>
</head>
<body>

<!-- Tela de PIN -->
<div id="lock">
  <div class="lock-box" id="lockBox">
    <h1>Gastos no Cartão</h1>
    <p>Digite o PIN para entrar</p>
    <div id="dots"><i></i><i></i><i></i><i></i></div>
    <div id="lockMsg"></div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="alt" id="btnBioLock" hidden>Biometria</button>
      <button data-k="0" id="pad0">0</button>
      <button class="alt" id="btnBack">Apagar</button>
    </div>
  </div>
</div>

<!-- App -->
<div id="app" hidden>
  <header class="shell">
    <div class="shell-top">
      <span class="title">Gastos no Cartão</span>
      <span class="status" id="status"><i class="dot"></i><span id="statusTxt">Conectando...</span></span>
      <button class="ghost" id="btnLock">Bloquear</button>
    </div>
    <nav class="tabs">
      <button class="tab active" id="tabLancar">Lançar</button>
      <button class="tab" id="tabRel">Relatório</button>
    </nav>
  </header>

  <main>
    <!-- Tela de lançamento -->
    <section id="viewLancar">
      <div class="card">
        <h2>Novo gasto</h2>
        <div class="field">
          <label for="fCartao">Cartão</label>
          <select id="fCartao"></select>
        </div>
        <div class="field">
          <label for="fTipo">Tipo</label>
          <select id="fTipo"></select>
        </div>
        <div class="field">
          <label for="fDesc">Descrição</label>
          <input type="text" id="fDesc" autocomplete="off" maxlength="120">
        </div>
        <div class="field">
          <label for="fValor">Valor (R$)</label>
          <input type="text" id="fValor" inputmode="numeric" autocomplete="off" placeholder="0,00">
        </div>
        <div class="field">
          <label for="fObs">OBS.</label>
          <input type="text" id="fObs" autocomplete="off" maxlength="200">
        </div>
        <div class="field">
          <label for="fData">Data</label>
          <input type="date" id="fData">
        </div>
        <button class="btn block" id="btnSalvar">Salvar gasto</button>
      </div>

      <div class="card">
        <h2>Últimos lançamentos</h2>
        <div id="recentes"><div class="empty">Carregando...</div></div>
        <div class="empty" style="padding-top:2px">Toque em um lançamento para editar ou excluir.</div>
      </div>

      <div class="foot">
        <button class="link" id="btnBio" hidden></button>
      </div>
    </section>

    <!-- Tela de relatório -->
    <section id="viewRel" hidden>
      <div class="monthnav">
        <button id="mPrev" aria-label="Mês anterior">&#8249;</button>
        <div class="m-label" id="mLabel"></div>
        <button id="mNext" aria-label="Próximo mês">&#8250;</button>
      </div>
      <div id="relatorio"></div>
    </section>
  </main>
</div>

<!-- Modal de edição -->
<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Editar gasto</h2>
    <div class="field">
      <label for="eCartao">Cartão</label>
      <select id="eCartao"></select>
    </div>
    <div class="field">
      <label for="eTipo">Tipo</label>
      <select id="eTipo"></select>
    </div>
    <div class="field">
      <label for="eDesc">Descrição</label>
      <input type="text" id="eDesc" autocomplete="off" maxlength="120">
    </div>
    <div class="field">
      <label for="eValor">Valor (R$)</label>
      <input type="text" id="eValor" inputmode="numeric" autocomplete="off" placeholder="0,00">
    </div>
    <div class="field">
      <label for="eObs">OBS.</label>
      <input type="text" id="eObs" autocomplete="off" maxlength="200">
    </div>
    <div class="field">
      <label for="eData">Data</label>
      <input type="date" id="eData">
    </div>
    <div class="actions">
      <button class="btn full" id="eSalvar">Salvar alterações</button>
      <button class="btn danger" id="eExcluir">Excluir</button>
      <button class="btn sec" id="eCancelar">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===================== Configuração ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyBiikcagIm1p7wJG6DsHijkvdy1fpDBn8Y",
  authDomain: "bd-teste-c931c.firebaseapp.com",
  databaseURL: "https://bd-teste-c931c-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bd-teste-c931c",
  storageBucket: "bd-teste-c931c.firebasestorage.app",
  messagingSenderId: "270308100761",
  appId: "1:270308100761:web:ae34fde6d5ae86b67b0608"
};
const NODE = "gastos_cartao";
const PIN = "1346";
const CARTOES = ["Nubank", "C6", "Diversos"];
const TIPOS = ["Crédito", "Débito"];
const LS_BIO = "gc_bio_id";
const LS_BIO_NO = "gc_bio_recusou";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = ref(db, NODE);

/* ===================== Utilidades ===================== */
const $ = id => document.getElementById(id);

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function pad2(n){ return String(n).padStart(2,"0"); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function fmtDate(s){
  if(!s || s.length < 10) return "";
  const p = s.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}
function brl(c){
  return (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function digitsToCents(str){
  const d = String(str).replace(/\D/g,"").slice(0,11);
  return d ? parseInt(d,10) : 0;
}
function maskCents(c){
  return c ? (c/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "";
}
function attachMask(el){
  el.addEventListener("input", () => { el.value = maskCents(digitsToCents(el.value)); });
}
let toastTimer = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function onErr(err){
  console.error(err);
  toast("Erro ao gravar no Firebase. Verifique as regras do banco.");
}

/* ===================== Biometria (WebAuthn) ===================== */
function b64(buf){
  let s = "";
  new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
  return btoa(s);
}
function unb64(str){
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function rand(n){ return crypto.getRandomValues(new Uint8Array(n)); }

let bioOk = false;
async function checkBioSupport(){
  try{
    bioOk = !!(window.isSecureContext && window.PublicKeyCredential &&
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ bioOk = false; }
  return bioOk;
}
async function bioEnable(){
  try{
    const cred = await navigator.credentials.create({
      publicKey:{
        challenge: rand(32),
        rp:{ name:"Gastos no Cartão" },
        user:{ id: rand(16), name:"usuario", displayName:"Usuário" },
        pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
        authenticatorSelection:{ authenticatorAttachment:"platform", userVerification:"required" },
        timeout:60000,
        attestation:"none"
      }
    });
    if(cred){
      store.set(LS_BIO, b64(cred.rawId));
      store.del(LS_BIO_NO);
      toast("Biometria ativada neste aparelho.");
      refreshBioUi();
      return true;
    }
  }catch(e){
    console.warn("Biometria não ativada:", e);
    toast("Não foi possível ativar a biometria.");
  }
  return false;
}
async function bioAuth(){
  const id = store.get(LS_BIO);
  if(!id) return false;
  try{
    const res = await navigator.credentials.get({
      publicKey:{
        challenge: rand(32),
        allowCredentials:[{ type:"public-key", id: unb64(id), transports:["internal"] }],
        userVerification:"required",
        timeout:60000
      }
    });
    return !!res;
  }catch(e){
    return false;
  }
}
function bioDisable(){
  store.del(LS_BIO);
  store.set(LS_BIO_NO, "1");
  toast("Biometria desativada. O PIN continua valendo.");
  refreshBioUi();
}
function refreshBioUi(){
  const ativa = !!store.get(LS_BIO);
  $("btnBioLock").hidden = !(bioOk && ativa);
  const b = $("btnBio");
  if(!bioOk){ b.hidden = true; return; }
  b.hidden = false;
  b.textContent = ativa ? "Desativar biometria neste aparelho" : "Ativar biometria neste aparelho";
}

/* ===================== Tela de PIN ===================== */
let entered = "";
function updateDots(){
  document.querySelectorAll("#dots i").forEach((d,i) => d.classList.toggle("on", i < entered.length));
}
function press(d){
  if($("lock").hidden || entered.length >= 4) return;
  $("lockMsg").textContent = "";
  entered += d;
  updateDots();
  if(entered.length === 4) setTimeout(checkPin, 120);
}
function back(){
  entered = entered.slice(0,-1);
  updateDots();
}
function checkPin(){
  if(entered === PIN){
    entered = "";
    updateDots();
    unlock(true);
  }else{
    $("lockMsg").textContent = "PIN incorreto";
    const box = $("lockBox");
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
    entered = "";
    updateDots();
  }
}
async function unlock(offerBio){
  $("lock").hidden = true;
  $("app").hidden = false;
  if(offerBio && bioOk && !store.get(LS_BIO) && !store.get(LS_BIO_NO)){
    if(confirm("Ativar o desbloqueio por biometria neste aparelho?")){
      await bioEnable();
    }else{
      store.set(LS_BIO_NO, "1");
      refreshBioUi();
    }
  }
}
function lockApp(){
  $("app").hidden = true;
  $("lock").hidden = false;
  $("modal").hidden = true;
  entered = "";
  updateDots();
  $("lockMsg").textContent = "";
}
$("pad").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");
  if(b) press(b.dataset.k);
});
$("btnBack").addEventListener("click", back);
$("btnBioLock").addEventListener("click", async () => {
  if(await bioAuth()) unlock(false);
  else $("lockMsg").textContent = "Biometria não reconhecida. Use o PIN.";
});
document.addEventListener("keydown", e => {
  if($("lock").hidden) return;
  if(/^\d$/.test(e.key)) press(e.key);
  else if(e.key === "Backspace") back();
});
$("btnLock").addEventListener("click", lockApp);

/* ===================== Formulários ===================== */
function fillSelect(sel, items, placeholder){
  sel.innerHTML = "";
  if(placeholder){
    const o = document.createElement("option");
    o.value = ""; o.textContent = placeholder;
    sel.appendChild(o);
  }
  items.forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}
fillSelect($("fCartao"), CARTOES, "Selecione o cartão");
fillSelect($("fTipo"), TIPOS);
fillSelect($("eCartao"), CARTOES);
fillSelect($("eTipo"), TIPOS);
attachMask($("fValor"));
attachMask($("eValor"));

function resetForm(){
  $("fCartao").value = "";
  $("fTipo").value = "Crédito";
  $("fDesc").value = "";
  $("fValor").value = "";
  $("fObs").value = "";
  $("fData").value = todayStr();
}
resetForm();

function readForm(p){
  return {
    cartao: $(p+"Cartao").value,
    tipo: $(p+"Tipo").value,
    descricao: $(p+"Desc").value.trim(),
    valor: digitsToCents($(p+"Valor").value),
    obs: $(p+"Obs").value.trim(),
    data: $(p+"Data").value
  };
}
function validate(o){
  if(!o.cartao) return "Selecione o cartão.";
  if(!o.descricao) return "Informe a descrição.";
  if(!o.valor) return "Informe o valor.";
  if(!o.data) return "Informe a data.";
  return "";
}

$("btnSalvar").addEventListener("click", () => {
  const o = readForm("f");
  const err = validate(o);
  if(err){ toast(err); return; }
  o.criadoEm = Date.now();
  const r = push(dbRef);
  set(r, o).then(() => toast("Gasto salvo.")).catch(onErr);
  resetForm();
});

/* ===================== Dados e renderização ===================== */
let dados = {};
let carregado = false;
const hoje = new Date();
let viewY = hoje.getFullYear();
let viewM = hoje.getMonth(); // 0-11

function lista(){
  return Object.entries(dados)
    .filter(([id,v]) => v && typeof v === "object")
    .map(([id,v]) => Object.assign({ id }, v));
}

function rowHtml(e, mostraCartao){
  const tipoCls = e.tipo === "Débito" ? "deb" : "cre";
  const meta = fmtDate(e.data) + (mostraCartao ? " · " + esc(e.cartao) : "");
  return '<div class="row" role="button" tabindex="0" data-id="' + esc(e.id) + '">' +
    '<div class="r-main">' +
      '<div class="r-desc">' + esc(e.descricao) + '</div>' +
      '<div class="r-meta">' + meta + ' <span class="badge ' + tipoCls + '">' + esc(e.tipo) + '</span></div>' +
      (e.obs ? '<div class="r-obs">' + esc(e.obs) + '</div>' : '') +
    '</div>' +
    '<div class="r-val">' + brl(e.valor || 0) + '</div>' +
  '</div>';
}

function renderRecentes(){
  const box = $("recentes");
  if(!carregado){ box.innerHTML = '<div class="empty">Carregando...</div>'; return; }
  const arr = lista().sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0)).slice(0,10);
  if(!arr.length){ box.innerHTML = '<div class="empty">Nenhum gasto lançado ainda.</div>'; return; }
  box.innerHTML = arr.map(e => rowHtml(e, true)).join("");
}

function nomeMes(y,m){
  const s = new Date(y,m,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderRelatorio(){
  $("mLabel").textContent = nomeMes(viewY, viewM);
  const box = $("relatorio");
  if(!carregado){ box.innerHTML = '<div class="empty">Carregando...</div>'; return; }

  const ym = viewY + "-" + pad2(viewM+1);
  const doMes = lista().filter(e => typeof e.data === "string" && e.data.startsWith(ym));

  // ordem: cartões da lista primeiro, depois qualquer outro nome que exista no banco
  const extras = [];
  doMes.forEach(e => {
    if(CARTOES.indexOf(e.cartao) === -1 && extras.indexOf(e.cartao) === -1) extras.push(e.cartao);
  });
  const ordem = CARTOES.concat(extras);

  let html = "";
  let totalGeral = 0;
  ordem.forEach(nome => {
    const itens = doMes
      .filter(e => e.cartao === nome)
      .sort((a,b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : (a.criadoEm||0) - (b.criadoEm||0)));
    const total = itens.reduce((s,e) => s + (e.valor || 0), 0);
    totalGeral += total;
    html += '<div class="card">' +
      '<div class="card-head"><h2>' + esc(nome || "Sem cartão") + '</h2><span>' + itens.length + ' lançamento(s)</span></div>' +
      (itens.length ? itens.map(e => rowHtml(e, false)).join("") : '<div class="empty">Sem lançamentos neste mês.</div>') +
      '<div class="card-total"><span>Total ' + esc(nome || "Sem cartão") + '</span><span>' + brl(total) + '</span></div>' +
    '</div>';
  });
  html += '<div class="grand"><span>Total do mês</span><span>' + brl(totalGeral) + '</span></div>';
  box.innerHTML = html;
}

function renderAll(){
  renderRecentes();
  renderRelatorio();
}

onValue(dbRef, snap => {
  dados = snap.val() || {};
  carregado = true;
  renderAll();
}, err => {
  console.error(err);
  carregado = true;
  dados = {};
  renderAll();
  toast("Sem permissão ou erro ao ler o Firebase. Verifique as regras do banco.");
});

onValue(ref(db, ".info/connected"), snap => {
  const ok = snap.val() === true;
  $("status").classList.toggle("ok", ok);
  $("statusTxt").textContent = ok ? "Conectado" : "Sem conexão";
});

/* ===================== Navegação ===================== */
function showTab(which){
  const rel = which === "rel";
  $("viewLancar").hidden = rel;
  $("viewRel").hidden = !rel;
  $("tabLancar").classList.toggle("active", !rel);
  $("tabRel").classList.toggle("active", rel);
  window.scrollTo(0,0);
}
$("tabLancar").addEventListener("click", () => showTab("lancar"));
$("tabRel").addEventListener("click", () => showTab("rel"));

$("mPrev").addEventListener("click", () => {
  viewM--; if(viewM < 0){ viewM = 11; viewY--; }
  renderRelatorio();
});
$("mNext").addEventListener("click", () => {
  viewM++; if(viewM > 11){ viewM = 0; viewY++; }
  renderRelatorio();
});

/* ===================== Editar / excluir ===================== */
let editId = null;

function openEdit(id){
  const e = dados[id];
  if(!e) return;
  editId = id;
  // garante que o cartão/tipo salvo exista na lista do modal
  [["eCartao", e.cartao], ["eTipo", e.tipo]].forEach(([sel, val]) => {
    const s = $(sel);
    if(val && !Array.from(s.options).some(o => o.value === val)){
      const o = document.createElement("option");
      o.value = val; o.textContent = val;
      s.appendChild(o);
    }
  });
  $("eCartao").value = e.cartao || CARTOES[0];
  $("eTipo").value = e.tipo || "Crédito";
  $("eDesc").value = e.descricao || "";
  $("eValor").value = maskCents(e.valor || 0);
  $("eObs").value = e.obs || "";
  $("eData").value = e.data || todayStr();
  $("modal").hidden = false;
}
function closeEdit(){
  $("modal").hidden = true;
  editId = null;
}

function onRowActivate(ev){
  const row = ev.target.closest("[data-id]");
  if(row) openEdit(row.dataset.id);
}
$("recentes").addEventListener("click", onRowActivate);
$("relatorio").addEventListener("click", onRowActivate);
function onRowKey(ev){
  if(ev.key === "Enter" || ev.key === " "){
    const row = ev.target.closest("[data-id]");
    if(row){ ev.preventDefault(); openEdit(row.dataset.id); }
  }
}
$("recentes").addEventListener("keydown", onRowKey);
$("relatorio").addEventListener("keydown", onRowKey);

$("eSalvar").addEventListener("click", () => {
  if(!editId) return;
  const o = readForm("e");
  const err = validate(o);
  if(err){ toast(err); return; }
  const id = editId;
  update(ref(db, NODE + "/" + id), o).then(() => toast("Alterações salvas.")).catch(onErr);
  closeEdit();
});
$("eExcluir").addEventListener("click", () => {
  if(!editId) return;
  if(!confirm("Excluir este gasto?")) return;
  const id = editId;
  remove(ref(db, NODE + "/" + id)).then(() => toast("Gasto excluído.")).catch(onErr);
  closeEdit();
});
$("eCancelar").addEventListener("click", closeEdit);
$("modal").addEventListener("click", e => { if(e.target === $("modal")) closeEdit(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("modal").hidden) closeEdit();
});

/* ===================== Biometria: botão no rodapé ===================== */
$("btnBio").addEventListener("click", async () => {
  if(store.get(LS_BIO)) bioDisable();
  else await bioEnable();
});

/* ===================== Início ===================== */
(async function init(){
  await checkBioSupport();
  refreshBioUi();
  if(bioOk && store.get(LS_BIO)){
    // tenta biometria logo ao abrir; se falhar, o PIN continua disponível
    if(await bioAuth()) unlock(false);
  }
})();
